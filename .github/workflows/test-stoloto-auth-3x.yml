name: TEST Stoloto authenticated 3x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Test Stoloto authenticated three times
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node test-stoloto-auth-3x.mjs
      - name: Commit report
        if: always()
        run: |
          if [ ! -f stoloto-auth-test-report.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stoloto-auth-test-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stoloto authenticated 3x test report"
          git push
