name: TEST Lucky authenticated 3x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Test Lucky authenticated three times
        env:
          LUCKY_EMAIL: ${{ secrets.LUCKY_EMAIL }}
          LUCKY_PASSWORD: ${{ secrets.LUCKY_PASSWORD }}
        run: node test-lucky-auth-3x.mjs
      - name: Commit test report only
        if: always()
        run: |
          if [ ! -f lucky-auth-test-report.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucky-auth-test-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lucky authenticated 3x test report"
          git push
