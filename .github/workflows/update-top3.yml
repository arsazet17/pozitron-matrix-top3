name: Update TOP-3 data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top3-stoloto-oauth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Update from official Stoloto
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        shell: bash
        run: |
          set -u
          success=0

          for attempt in 1 2 3 4 5; do
            echo "=== STOLOTO STABILITY ATTEMPT $attempt/5 ==="

            if node update-top3-stoloto-oauth.mjs; then
              success=1
              break
            fi

            echo "Столото пока нестабилен; полный цикл тройной проверки будет повторён."
            if [ "$attempt" -lt 5 ]; then
              echo "Повтор через 20 секунд..."
              sleep 20
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Столото не дал стабильные три чтения после 5 полных попыток."
            exit 1
          fi

      - name: Save verified TOP-3 facts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- top3-live.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi

          git add top3-live.json
          git commit -m "Update TOP-3 from verified Stoloto OAuth"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
