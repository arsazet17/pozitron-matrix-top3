name: Matrix TOP-3 · AI v1 All Bets Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-ai-backtest-once.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: AI v1 honest walk-forward all bets
        shell: bash
        run: |
          node <<'NODE'

          const fs = require('fs');
          const vm = require('vm');

          const ctx={window:{}};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('top3-data.js','utf8'),ctx);

          const seed=(ctx.window.TOP3_SEED||[]).map(r=>({
            id:+r[0],date:String(r[1]),time:String(r[2]),a:+r[3],b:+r[4],c:+r[5]
          }));
          const liveJson=JSON.parse(fs.readFileSync('top3-live.json','utf8'));
          const live=(liveJson.draws||[]).map(r=>({
            id:+r.id,date:String(r.date),time:String(r.time),a:+r.a,b:+r.b,c:+r.c
          }));
          const byId=new Map();
          for(const d of seed) byId.set(d.id,d);
          for(const d of live) byId.set(d.id,d);
          const draws=[...byId.values()].sort((a,b)=>a.id-b.id);

          const POS=['a','b','c'];
          const MODEL_NAMES=['same30','same100','same300','global100','global500','transition','recency'];
          const WARMUP=500;

          function uniform(){return Array(10).fill(0.1);}
          function normalize(a){const s=a.reduce((x,y)=>x+y,0);return s>0?a.map(x=>x/s):uniform();}
          function argmax(a){let k=0;for(let i=1;i<a.length;i++)if(a[i]>a[k])k=i;return k;}

          function freqDist(list,key,limit,alpha=2){
            const c=Array(10).fill(alpha);
            const start=Math.max(0,list.length-limit);
            for(let i=start;i<list.length;i++)c[list[i][key]]++;
            return normalize(c);
          }
          function recencyDist(list,key,limit=150,decay=0.97,alpha=1){
            const c=Array(10).fill(alpha);
            let w=1, used=0;
            for(let i=list.length-1;i>=0&&used<limit;i--,used++){c[list[i][key]]+=w;w*=decay;}
            return normalize(c);
          }
          function transitionDist(list,key,alpha=1){
            if(list.length<2)return uniform();
            const last=list[list.length-1][key];
            const c=Array(10).fill(alpha);
            let found=0, checked=0;
            for(let i=list.length-2;i>=0&&checked<500;i--,checked++){
              if(list[i][key]===last){c[list[i+1][key]]++;found++;}
            }
            return found?normalize(c):freqDist(list,key,100,2);
          }
          function top1Hit(pred,actual){return argmax(pred)===actual?1:0;}

          const perf={};
          for(const m of MODEL_NAMES)perf[m]=POS.map(()=>({q:[],hits:0}));
          function perfWeight(m,p){
            const s=perf[m][p],n=s.q.length;
            if(n<50)return 1;
            const shrunk=(s.hits+10)/(n+100);
            return Math.max(0.55,Math.min(1.65,shrunk/0.10));
          }
          function pushPerf(m,p,hit){
            const s=perf[m][p];s.q.push(hit);s.hits+=hit;
            if(s.q.length>300)s.hits-=s.q.shift();
          }

          function modelDists(globalHist,sameHist){
            const out={};
            for(const m of MODEL_NAMES)out[m]=[];
            for(const key of POS){
              out.same30.push(freqDist(sameHist,key,30,2));
              out.same100.push(freqDist(sameHist,key,100,2));
              out.same300.push(freqDist(sameHist,key,300,2));
              out.global100.push(freqDist(globalHist,key,100,2));
              out.global500.push(freqDist(globalHist,key,500,2));
              out.transition.push(transitionDist(sameHist,key,1));
              out.recency.push(recencyDist(sameHist,key,150,0.97,1));
            }
            return out;
          }
          function ensemble(models){
            const out=[];
            for(let p=0;p<3;p++){
              const acc=Array(10).fill(0);let ws=0;
              for(const m of MODEL_NAMES){
                const w=perfWeight(m,p);ws+=w;
                for(let d=0;d<10;d++)acc[d]+=w*models[m][p][d];
              }
              out.push(acc.map(x=>x/ws));
            }
            return out;
          }

          function buildEmpirical(sameHist){
            const ab=Array(100).fill(0),bc=Array(100).fill(0),ac=Array(100).fill(0);
            const pStart=Math.max(0,sameHist.length-300);
            for(let i=pStart;i<sameHist.length;i++){
              const d=sameHist[i];
              ab[d.a*10+d.b]++;bc[d.b*10+d.c]++;ac[d.a*10+d.c]++;
            }
            const tri=new Map();
            const tStart=Math.max(0,sameHist.length-500);
            for(let i=tStart;i<sameHist.length;i++){
              const d=sameHist[i],k=d.a*100+d.b*10+d.c;
              tri.set(k,(tri.get(k)||0)+1);
            }
            return {
              ab,bc,ac,
              pairN:sameHist.length-pStart,
              tri,triN:sameHist.length-tStart
            };
          }
          function pairScore(probs,emp,p1,p2,x,y){
            const independent=probs[p1][x]*probs[p2][y];
            const arr=(p1===0&&p2===1)?emp.ab:(p1===1&&p2===2)?emp.bc:emp.ac;
            const empirical=(arr[x*10+y]+0.35)/(emp.pairN+35);
            return 0.78*independent+0.22*empirical;
          }
          function tripleScore(probs,emp,a,b,c){
            const independent=probs[0][a]*probs[1][b]*probs[2][c];
            const n=emp.tri.get(a*100+b*10+c)||0;
            const empirical=(n+0.08)/(emp.triN+80);
            return 0.90*independent+0.10*empirical;
          }
          function multiset(a,b,c){return [a,b,c].sort((x,y)=>x-y).join('');}
          function permsFor(a,b,c){
            if(a===b&&b===c)return [[a,b,c]];
            if(a===b)return [[a,a,c],[a,c,a],[c,a,a]];
            if(b===c)return [[a,b,b],[b,a,b],[b,b,a]];
            return [[a,b,c],[a,c,b],[b,a,c],[b,c,a],[c,a,b],[c,b,a]];
          }
          const BAG_PATTERNS=[];
          for(let a=0;a<10;a++)for(let b=a;b<10;b++)for(let c=b;c<10;c++){
            if(a===c)continue;
            const perms=permsFor(a,b,c);
            BAG_PATTERNS.push({triple:[a,b,c],perms,permCount:perms.length});
          }
          function sameOrdered(t,p){return t.a===p[0]&&t.b===p[1]&&t.c===p[2];}
          function sameBag(t,p){return multiset(t.a,t.b,t.c)===multiset(...p);}

          function buildPredictions(probs,emp){
            let exact1={score:-1,pos:0,digit:0};
            for(let p=0;p<3;p++)for(let d=0;d<10;d++)if(probs[p][d]>exact1.score)exact1={score:probs[p][d],pos:p,digit:d};

            let first2={score:-1,pair:[0,0]},last2={score:-1,pair:[0,0]},any2={score:-1,pair:[0,1]};
            for(let x=0;x<10;x++)for(let y=0;y<10;y++){
              const ab=pairScore(probs,emp,0,1,x,y);if(ab>first2.score)first2={score:ab,pair:[x,y]};
              const bc=pairScore(probs,emp,1,2,x,y);if(bc>last2.score)last2={score:bc,pair:[x,y]};
              if(x<y){
                const ac=pairScore(probs,emp,0,2,x,y)+pairScore(probs,emp,0,2,y,x);
                if(ac>any2.score)any2={score:ac,pair:[x,y]};
              }
            }

            let exact3={score:-1,triple:[0,0,0]};
            const tripleScores=Array(1000);
            for(let a=0;a<10;a++)for(let b=0;b<10;b++)for(let c=0;c<10;c++){
              const s=tripleScore(probs,emp,a,b,c);
              tripleScores[a*100+b*10+c]=s;
              if(s>exact3.score)exact3={score:s,triple:[a,b,c]};
            }

            let bag3={score:-1,triple:[0,0,1],permCount:3,exactOrder:[0,0,1],exactScore:0};
            for(const pat of BAG_PATTERNS){
              let sum=0,bestS=-1,bestP=null;
              for(const p of pat.perms){
                const s=tripleScores[p[0]*100+p[1]*10+p[2]];
                sum+=s;if(s>bestS){bestS=s;bestP=p;}
              }
              if(sum>bag3.score)bag3={score:sum,triple:pat.triple,permCount:pat.permCount,exactOrder:bestP,exactScore:bestS};
            }
            return {exact1,first2,last2,any2,exact3,any3:bag3,exact3any3:bag3,combo6:bag3};
          }

          const RULES={
            exact1:{name:'Точно 1',stake:()=>90,baseline:()=>0.10},
            first2:{name:'Первые 2',stake:()=>90,baseline:()=>0.01},
            last2:{name:'Последние 2',stake:()=>90,baseline:()=>0.01},
            any2:{name:'Любые 2',stake:()=>90,baseline:()=>0.02},
            exact3:{name:'Точно 3',stake:()=>90,baseline:()=>0.001},
            any3:{name:'Любые 3',stake:p=>90*p.permCount,baseline:p=>p.permCount/1000},
            exact3any3:{name:'Точно 3 + Любые 3',stake:()=>90,baseline:p=>p.permCount/1000},
            combo6:{name:'Комбо 6',stake:()=>90,baseline:p=>p.permCount/1000}
          };
          function settle(key,p,t){
            const stake=RULES[key].stake(p);let gross=0,hit=false,detail='';
            if(key==='exact1'){
              hit=[t.a,t.b,t.c][p.pos]===p.digit;gross=hit?450:0;detail=`${'ABC'[p.pos]}=${p.digit}`;
            }else if(key==='first2'){
              hit=t.a===p.pair[0]&&t.b===p.pair[1];gross=hit?5400:0;detail=`${p.pair[0]}${p.pair[1]}-`;
            }else if(key==='last2'){
              hit=t.b===p.pair[0]&&t.c===p.pair[1];gross=hit?5400:0;detail=`-${p.pair[0]}${p.pair[1]}`;
            }else if(key==='any2'){
              const [x,y]=p.pair;hit=(t.a===x&&t.c===y)||(t.a===y&&t.c===x);gross=hit?2700:0;detail=`${x}-${y}`;
            }else if(key==='exact3'){
              hit=sameOrdered(t,p.triple);gross=hit?45000:0;detail=p.triple.join('');
            }else if(key==='any3'){
              hit=sameBag(t,p.triple);gross=hit?45000:0;detail=p.triple.join('');
            }else if(key==='exact3any3'){
              const bag=sameBag(t,p.triple),exact=sameOrdered(t,p.exactOrder);hit=bag;
              if(exact)gross=27000;else if(bag)gross=p.permCount===3?9000:4500;
              detail=p.exactOrder.join('')+' / '+p.triple.join('');
            }else if(key==='combo6'){
              hit=sameBag(t,p.triple);gross=hit?(p.permCount===3?18000:9000):0;detail=p.triple.join('');
            }
            return {key,name:RULES[key].name,stake,gross,hit,detail,score:p.score,baseline:RULES[key].baseline(p)};
          }

          function summarize(events){
            let bets=0,hits=0,stake=0,gross=0,miss=0,maxMiss=0,baseSum=0;
            for(const e of events){
              bets++;stake+=e.stake;gross+=e.gross;baseSum+=e.baseline;
              if(e.hit){hits++;miss=0;}else{miss++;if(miss>maxMiss)maxMiss=miss;}
            }
            const net=gross-stake;
            return {bets,hits,hitRate:bets?hits/bets:0,baselineHitRate:bets?baseSum/bets:0,
              lift:bets&&baseSum?(hits/bets)/(baseSum/bets):0,stake,gross,net,roi:stake?net/stake:0,maxMiss};
          }
          function money(x){return Math.round(x).toLocaleString('ru-RU');}
          function pct(x){return (100*x).toFixed(2)+'%';}
          function printSummary(label,s){
            console.log(label.padEnd(23),`ставок=${String(s.bets).padStart(5)}`,`попад=${String(s.hits).padStart(4)}`,
              `hit=${pct(s.hitRate).padStart(7)}`,`база=${pct(s.baselineHitRate).padStart(7)}`,`x=${s.lift.toFixed(2).padStart(4)}`,
              `ставка=${money(s.stake).padStart(12)}₽`,`выигрыш=${money(s.gross).padStart(12)}₽`,
              `итог=${money(s.net).padStart(12)}₽`,`ROI=${pct(s.roi).padStart(8)}`,`max-мимо=${s.maxMiss}`);
          }

          const sameByTime=new Map(),globalHist=[],events=[],lastArchive=[];
          for(let i=0;i<draws.length;i++){
            const target=draws[i],sameHist=sameByTime.get(target.time)||[];
            if(i>=WARMUP){
              const models=modelDists(globalHist,sameHist);
              if(sameHist.length>=20){
                const probs=ensemble(models),emp=buildEmpirical(sameHist),preds=buildPredictions(probs,emp),settled=[];
                for(const key of Object.keys(RULES)){
                  const e=settle(key,preds[key],target);events.push({...e,id:target.id,time:target.time,date:target.date});settled.push(e);
                }
                lastArchive.push({id:target.id,date:target.date,time:target.time,fact:[target.a,target.b,target.c],
                  advice:Object.fromEntries(settled.map(e=>[e.key,{name:e.name,detail:e.detail,hit:e.hit,gross:e.gross,stake:e.stake,
                    score:+e.score.toFixed(6),baseline:+e.baseline.toFixed(6)}]))});
                if(lastArchive.length>200)lastArchive.shift();
              }
              for(const m of MODEL_NAMES)for(let p=0;p<3;p++)pushPerf(m,p,top1Hit(models[m][p],target[POS[p]]));
            }
            sameHist.push(target);sameByTime.set(target.time,sameHist);globalHist.push(target);
          }

          const keys=Object.keys(RULES),overall={};
          console.log('='.repeat(180));
          console.log('MATRIX TOP-3 · NEW AI v1 · HONEST WALK-FORWARD · ALL BET TYPES');
          console.log(`Архив: ${draws.length} уникальных тиражей · №${draws[0].id} → №${draws[draws.length-1].id}`);
          console.log(`Warm-up: ${WARMUP}; каждый прогноз видит только прошлое.`);
          console.log('v1: адаптивный ансамбль same-time 30/100/300 + global 100/500 + transitions + recency; pair/triple scores softly blend same-time joint history.');
          console.log('Правила/выплаты: по присланным скриншотам. Любые 2 трактуется как A/C в любом порядке (пример 3–7 => 3x7 или 7x3).');
          console.log('Для Любые 3 / Точно3+Любые3 / Комбо6 тестируются только схемы с 3 или 6 перестановками; все три одинаковые исключены.');
          console.log('='.repeat(180));

          console.log('\n--- ВСЯ WALK-FORWARD ИСТОРИЯ ---');
          for(const key of keys){const s=summarize(events.filter(e=>e.key===key));overall[key]=s;printSummary(RULES[key].name,s);}

          const windows={};
          for(const N of [50,100,500]){
            console.log(`\n--- ПОСЛЕДНИЕ ${N} ТИРАЖЕЙ С ПРОГНОЗОМ ---`);
            const ids=[...new Set(events.map(e=>e.id))].slice(-N),idset=new Set(ids);windows[N]={};
            for(const key of keys){const s=summarize(events.filter(e=>e.key===key&&idset.has(e.id)));windows[N][key]=s;printSummary(RULES[key].name,s);}
          }

          console.log('\n--- ОСНОВНЫЕ ВРЕМЕНА МАТРИЦЫ · ПОСЛЕДНИЕ ДО 500 ---');
          const matrixTimes=['02:40','04:40','06:40','07:40','09:40','11:40','13:40','16:25','21:25','22:40'],byTime={};
          for(const time of matrixTimes){
            const ids=[...new Set(events.filter(e=>e.time===time).map(e=>e.id))].slice(-500),idset=new Set(ids);
            console.log(`\n${time} · n=${ids.length}`);byTime[time]={};
            for(const key of keys){const s=summarize(events.filter(e=>e.key===key&&e.time===time&&idset.has(e.id)));byTime[time][key]=s;printSummary('  '+RULES[key].name,s);}
          }

          const report={generatedAt:new Date().toISOString(),algorithm:'AI v1 adaptive ensemble, honest walk-forward',
            archive:{count:draws.length,firstId:draws[0].id,lastId:draws[draws.length-1].id,warmup:WARMUP},
            rules:{exact1:{stake:90,payout:450},first2:{stake:90,payout:5400},last2:{stake:90,payout:5400},
              any2:{stake:90,payout:2700,note:'A/C either order; middle arbitrary'},exact3:{stake:90,payout:45000},
              any3:{stake:'270 for 3 perms / 540 for 6 perms',payout:45000},
              exact3any3:{stake:90,payout:'27000 exact; 9000 other if 3 perms; 4500 other if 6 perms'},
              combo6:{stake:90,payout:'18000 for 3 perms; 9000 for 6 perms'}},
            overall,windows,byTime,lastArchive};
          fs.writeFileSync('matrix-ai-v1-all-bets-report.json',JSON.stringify(report,null,2));
          console.log('\nREPORT DONE');
          NODE

      - name: Upload AI v1 report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-ai-v1-all-bets-report
          path: matrix-ai-v1-all-bets-report.json
          if-no-files-found: error
