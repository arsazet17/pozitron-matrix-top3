name: Matrix TOP-3 · Sequence-6 v3 Separate Digit Matrices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sequence6-v3-backtest.mjs'
      - '.github/workflows/matrix-sequence6-v3-backtest.yml'

permissions:
  contents: read

jobs:
  sequence6-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Sequence-6 v3
        run: node sequence6-v3-backtest.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-sequence6-v3-report
          path: |
            sequence6-v3-report.json
            sequence6-v3-report.md
          retention-days: 30
