name: TOP-3 backup updater

on:
  workflow_dispatch:
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'

permissions:
  contents: write

concurrency:
  group: top3-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backup update from official Stoloto
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Резерв Столото: попытка $attempt из 3"
            if node update-top3-stoloto.mjs; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 45
          done

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "Update TOP-3 from official Stoloto (backup)"
          git push
