name: TOP-3 backup updater

on:
  workflow_dispatch:
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'

permissions:
  contents: write

concurrency:
  group: top3-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Read official Stoloto archive in browser
        shell: bash
        run: node update-top3-stoloto-browser.mjs

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "Update TOP-3 from Stoloto browser parser (backup)"
          git push
