name: TOP-3 backup updater

on:
  workflow_dispatch:
  schedule:
    # Резервный запуск между основными запусками.
    - cron: '8,18,28,38,48,58 * * * *'

permissions:
  contents: write

concurrency:
  group: top3-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update TOP-3 with retries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Резервная попытка $attempt из 3"
            if node update-top3.mjs; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 45
          done

      - name: Validate live file
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('top3-live.json','utf8'));
            if (!Array.isArray(j.draws) || !j.draws.length) throw new Error('top3-live.json пуст');
            if (!Number.isInteger(Number(j.latest))) throw new Error('latest отсутствует');
            console.log('latest:', j.latest, 'draws:', j.draws.length, 'updatedAt:', j.updatedAt);
          "

      - name: Commit updated live data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "Update TOP-3 live data (backup)"
          git push
