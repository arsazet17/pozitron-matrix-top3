name: Matrix TOP-3 · Sequence-6 Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sequence6-backtest.mjs'
      - '.github/workflows/matrix-sequence6-backtest.yml'

permissions:
  contents: read

jobs:
  sequence6:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Sequence-6 historical backtest
        run: node sequence6-backtest.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-sequence6-report
          path: |
            sequence6-backtest-report.json
            sequence6-backtest-report.md
          retention-days: 30
