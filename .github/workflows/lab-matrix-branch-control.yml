name: LAB Matrix Branch Control

on:
  push:
    branches:
      - main
      - remove-lab-legacy-v1.8.1
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'lab-branch-core.js'
      - 'lab-branch.js'
      - 'lab-branch.css'
      - 'sw.js'
      - 'branch-archive-top3.json'
      - 'scripts/branch-archive-top3-server.cjs'
      - 'test-lab-branch.mjs'
      - 'test-lab-interactions.cjs'
      - '.github/workflows/lab-matrix-branch-control.yml'
      - '.github/workflows/branch-archive-top3-server.yml'

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check app.js
          node --check lab-branch-core.js
          node --check lab-branch.js
          node --check scripts/branch-archive-top3-server.cjs
          node --check test-lab-branch.mjs
          node --check test-lab-interactions.cjs
      - name: LAB branch control run
        run: node test-lab-branch.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: LAB browser interactions (desktop and mobile)
        run: node test-lab-interactions.cjs
