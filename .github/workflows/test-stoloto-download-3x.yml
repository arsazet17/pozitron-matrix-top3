name: TEST Stoloto official download 3x

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'test-stoloto-download-3x.mjs'
      - '.github/workflows/test-stoloto-download-3x.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Test official download three times
        run: node test-stoloto-download-3x.mjs

      - name: Commit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stoloto-download-test-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Stoloto official download 3x test report"
          git push

      - name: Require PASS
        run: |
          node -e "
            const j=require('./stoloto-download-test-report.json');
            console.log(JSON.stringify(j,null,2));
            if(j.status!=='PASS') process.exit(1);
          "
