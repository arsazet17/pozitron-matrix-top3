name: TEST Stoloto parser 3x

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'test-stoloto-parser-3x.mjs'
      - '.github/workflows/test-stoloto-parser-3x.yml'

permissions:
  contents: write

concurrency:
  group: test-stoloto-parser-3x
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run three independent Stoloto checks
        shell: bash
        run: node test-stoloto-parser-3x.mjs

      - name: Commit test report only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stoloto-parser-test-report.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
            exit 0
          fi
          git commit -m "Stoloto parser 3x test report"
          git push

      - name: Show result
        shell: bash
        run: |
          node -e "
            const j=require('./stoloto-parser-test-report.json');
            console.log(JSON.stringify(j,null,2));
            if(j.status!=='PASS') process.exit(1);
          "
